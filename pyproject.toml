[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ghosty-input"
version = "0.5.1"
description = "Offline precision hand-gesture mouse control and desk-surface virtual keyboard."
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = {text = "MIT"}
authors = [{name = "iEmmAd / cybrex"}]
keywords = [
  "computer-vision",
  "hand-tracking",
  "mediapipe",
  "virtual-mouse",
  "virtual-keyboard",
  "accessibility",
  "human-computer-interaction",
  "linux",
  "wayland",
]
dependencies = [
  "mediapipe>=0.10.14,<0.11",
  "numpy>=1.26,<3",
  "opencv-contrib-python>=4.9,<6",
  "PyAutoGUI>=0.9.54,<1",
  "PySide6>=6.7,<7",
  "evdev>=1.7,<2; sys_platform == 'linux'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.8",
  "pyinstaller>=6.10,<7",
]

[project.scripts]
ghosty-input = "ghosty_input.app:main"

[tool.setuptools.packages.find]
include = ["ghosty_input*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
