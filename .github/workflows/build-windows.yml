name: Build Windows Distribution

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
    paths:
      - "ghosty_input/**"
      - "installer/**"
      - "assets/**"
      - "requirements.txt"
      - "constraints-release.txt"
      - "pyproject.toml"
      - "run.py"
      - ".github/workflows/build-windows.yml"
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      VERSION: "0.6.0a1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install application and build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints-release.txt -r requirements.txt pyinstaller
          python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q ghosty_input run.py

      - name: Verify source version
        shell: pwsh
        run: |
          $actual = python run.py --version
          if ($actual.Trim() -ne $env:VERSION) {
            throw "Expected Ghosty Input $env:VERSION, got $actual"
          }

      - name: Build portable application
        run: >
          pyinstaller
          --noconfirm
          --clean
          --windowed
          --name GhostyInput
          --collect-all mediapipe
          --collect-all PySide6
          --add-data "assets;assets"
          run.py

      - name: Verify portable binary
        shell: pwsh
        run: |
          $exe = Resolve-Path "dist/GhostyInput/GhostyInput.exe"
          if (-not (Test-Path $exe)) { throw "GhostyInput.exe was not produced." }
          $env:GHOSTY_EXPECTED_VERSION = $env:VERSION
          $process = Start-Process -FilePath $exe -ArgumentList "--package-smoke-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Packaged Windows smoke failed with exit code $($process.ExitCode)."
          }

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\GhostyInput.iss"'

      - name: Package portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/GhostyInput/*" -DestinationPath "dist/GhostyInput-Windows-x64-v$env:VERSION.zip" -Force

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $targets = @(
            "dist/GhostyInput-Windows-x64-v$env:VERSION.zip",
            "dist/GhostyInputSetup.exe"
          )
          $lines = foreach ($target in $targets) {
            if (-not (Test-Path $target)) { throw "Missing distribution artifact: $target" }
            $hash = (Get-FileHash $target -Algorithm SHA256).Hash.ToLower()
            "$hash  $(Split-Path $target -Leaf)"
          }
          $lines | Set-Content -Path "dist/SHA256SUMS-Windows.txt" -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: GhostyInput-Windows-v${{ env.VERSION }}
          if-no-files-found: error
          path: |
            dist/GhostyInput-Windows-x64-v${{ env.VERSION }}.zip
            dist/GhostyInputSetup.exe
            dist/SHA256SUMS-Windows.txt
