name: Build Linux Distribution

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Linux runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            desktop-file-utils \
            libdbus-1-3 \
            libegl1 \
            libgl1 \
            libglib2.0-0 \
            libx11-xcb1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-xinerama0

      - name: Install application and build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints-release.txt -r requirements.txt pyinstaller
          python -m pip check

      - name: Validate release dependency resolution
        run: |
          python - <<'PY'
          from importlib.metadata import PackageNotFoundError, version

          expected = {
              "mediapipe": "0.10.35",
              "numpy": "2.4.6",
              "opencv-contrib-python": "5.0.0.93",
              "PyAutoGUI": "0.9.54",
              "PySide6": "6.11.2",
              "evdev": "1.9.3",
              "pyinstaller": "6.22.2",
          }
          for package, wanted in expected.items():
              actual = version(package)
              if actual != wanted:
                  raise SystemExit(f"{package}: expected {wanted}, got {actual}")

          try:
              version("opencv-python")
          except PackageNotFoundError:
              pass
          else:
              raise SystemExit(
                  "opencv-python and opencv-contrib-python must not coexist in the release environment"
              )
          PY

      - name: Validate source runtime
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m compileall -q ghosty_input tests
          python run.py --version
          python run.py --diagnose
          python run.py --ui-smoke-test

      - name: Build Linux application
        run: |
          pyinstaller \
            --noconfirm \
            --clean \
            --onedir \
            --name GhostyInput \
            --collect-all mediapipe \
            --collect-all evdev \
            --add-data "assets:assets" \
            run.py

      - name: Verify packaged runtime
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ./dist/GhostyInput/GhostyInput --version
          ./dist/GhostyInput/GhostyInput --diagnose > dist/GhostyInput/BUILD-DIAGNOSTICS.txt
          ./dist/GhostyInput/GhostyInput --ui-smoke-test

      - name: Add Linux helpers and manifests
        run: |
          cp scripts/ghosty-input-linux-setup.sh dist/GhostyInput/
          cp docs/LINUX.md dist/GhostyInput/README-LINUX.md
          cp LICENSE dist/GhostyInput/LICENSE
          cp constraints-release.txt dist/GhostyInput/RELEASE-CONSTRAINTS.txt
          cat > dist/GhostyInput/run-ghosty.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          HERE="$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)"
          exec "${HERE}/GhostyInput" "$@"
          SH
          chmod +x \
            dist/GhostyInput/GhostyInput \
            dist/GhostyInput/run-ghosty.sh \
            dist/GhostyInput/ghosty-input-linux-setup.sh
          python - <<'PY'
          from importlib import metadata
          from pathlib import Path
          import os
          import platform
          import sys

          root = Path("dist/GhostyInput")
          packages = []
          for dist in metadata.distributions():
              name = dist.metadata.get("Name") or "unknown"
              version = dist.version or "unknown"
              license_value = (
                  dist.metadata.get("License-Expression")
                  or dist.metadata.get("License")
                  or "unspecified"
              )
              packages.append((name, version, " ".join(license_value.split())))
          packages.sort(key=lambda item: item[0].lower())

          (root / "BUILD-MANIFEST.txt").write_text(
              "\n".join(
                  [
                      "Ghosty Input Linux build manifest",
                      f"source_head_sha={os.environ.get('SOURCE_HEAD_SHA', 'unknown')}",
                      f"checkout_sha={os.environ.get('GITHUB_SHA', 'unknown')}",
                      f"python={platform.python_version()}",
                      f"platform={platform.platform()}",
                      f"architecture={platform.machine()}",
                      f"executable_python={sys.executable}",
                  ]
              )
              + "\n",
              encoding="utf-8",
          )
          (root / "DEPENDENCY-MANIFEST.txt").write_text(
              "Name\tVersion\tDeclared license metadata\n"
              + "\n".join("\t".join(item) for item in packages)
              + "\n",
              encoding="utf-8",
          )
          PY

      - name: Build portable archive
        run: |
          tar -C dist -czf dist/GhostyInput-Linux-x86_64-v0.5.0.tar.gz GhostyInput

      - name: Build Debian package
        run: |
          PKGROOT="dist/deb-root"
          mkdir -p \
            "${PKGROOT}/DEBIAN" \
            "${PKGROOT}/opt/ghosty-input" \
            "${PKGROOT}/usr/bin" \
            "${PKGROOT}/usr/share/applications" \
            "${PKGROOT}/usr/share/icons/hicolor/256x256/apps"
          cp -a dist/GhostyInput/. "${PKGROOT}/opt/ghosty-input/"
          ln -s /opt/ghosty-input/run-ghosty.sh "${PKGROOT}/usr/bin/ghosty-input"
          cp assets/logo.png "${PKGROOT}/usr/share/icons/hicolor/256x256/apps/ghosty-input.png"
          cat > "${PKGROOT}/usr/share/applications/ghosty-input.desktop" <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Version=1.0
          Name=Ghosty Input
          Comment=Camera-based hand gesture mouse and desk keyboard
          Exec=/opt/ghosty-input/run-ghosty.sh
          Icon=ghosty-input
          Terminal=false
          Categories=Utility;Accessibility;
          StartupNotify=true
          DESKTOP
          cat > "${PKGROOT}/DEBIAN/control" <<'CONTROL'
          Package: ghosty-input
          Version: 0.5.0
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Ghosty Input
          Homepage: https://github.com/imedkablavi/ghosty_input
          Description: Offline hand gesture mouse and desk-surface virtual keyboard
           Linux desktop build with native uinput support and local computer vision.
          CONTROL
          desktop-file-validate "${PKGROOT}/usr/share/applications/ghosty-input.desktop"
          dpkg-deb --root-owner-group --build "${PKGROOT}" "dist/ghosty-input_0.5.0_amd64.deb"

      - name: Verify Debian package
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          dpkg-deb --info dist/ghosty-input_0.5.0_amd64.deb
          rm -rf dist/deb-smoke
          mkdir -p dist/deb-smoke
          dpkg-deb -x dist/ghosty-input_0.5.0_amd64.deb dist/deb-smoke
          test -x dist/deb-smoke/opt/ghosty-input/GhostyInput
          test -x dist/deb-smoke/opt/ghosty-input/run-ghosty.sh
          test -L dist/deb-smoke/usr/bin/ghosty-input
          test "$(readlink dist/deb-smoke/usr/bin/ghosty-input)" = "/opt/ghosty-input/run-ghosty.sh"
          desktop-file-validate dist/deb-smoke/usr/share/applications/ghosty-input.desktop
          dist/deb-smoke/opt/ghosty-input/GhostyInput --version
          dist/deb-smoke/opt/ghosty-input/GhostyInput --diagnose > /tmp/ghosty-deb-diagnostics.txt
          dist/deb-smoke/opt/ghosty-input/GhostyInput --ui-smoke-test

      - name: Enforce Linux package size budget
        run: |
          portable_bytes=$(stat -c%s dist/GhostyInput-Linux-x86_64-v0.5.0.tar.gz)
          deb_bytes=$(stat -c%s dist/ghosty-input_0.5.0_amd64.deb)
          portable_limit=$((230 * 1024 * 1024))
          deb_limit=$((180 * 1024 * 1024))
          echo "Portable: ${portable_bytes} bytes (limit ${portable_limit})"
          echo "Debian:   ${deb_bytes} bytes (limit ${deb_limit})"
          test "${portable_bytes}" -le "${portable_limit}"
          test "${deb_bytes}" -le "${deb_limit}"

      - name: Generate checksums and size report
        run: |
          cp dist/GhostyInput/BUILD-MANIFEST.txt dist/BUILD-MANIFEST-Linux.txt
          cp dist/GhostyInput/DEPENDENCY-MANIFEST.txt dist/DEPENDENCY-MANIFEST-Linux.txt
          cd dist
          sha256sum \
            GhostyInput-Linux-x86_64-v0.5.0.tar.gz \
            ghosty-input_0.5.0_amd64.deb \
            > SHA256SUMS-Linux.txt
          du -h \
            GhostyInput-Linux-x86_64-v0.5.0.tar.gz \
            ghosty-input_0.5.0_amd64.deb \
            | tee LINUX-SIZES.txt

      - uses: actions/upload-artifact@v4
        with:
          name: GhostyInput-Linux-v0.5.0
          path: |
            dist/GhostyInput-Linux-x86_64-v0.5.0.tar.gz
            dist/ghosty-input_0.5.0_amd64.deb
            dist/SHA256SUMS-Linux.txt
            dist/LINUX-SIZES.txt
            dist/BUILD-MANIFEST-Linux.txt
            dist/DEPENDENCY-MANIFEST-Linux.txt
          if-no-files-found: error
          retention-days: 14
